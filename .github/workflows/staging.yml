name: staging

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-customer/package-lock.json

      - name: Publish backend
        run: dotnet publish dotnet-backend/dotnet_backend/dotnet-backend.csproj -c Release -r linux-x64 --self-contained -o release/api

      - name: Build migration bundle
        working-directory: dotnet-backend/dotnet_backend
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.9
          EFCMD=dotnet-ef
          if ! command -v dotnet-ef >/dev/null 2>&1; then EFCMD="$HOME/.dotnet/tools/dotnet-ef"; fi
          "$EFCMD" migrations bundle \
            --project dotnet-backend.csproj \
            -r linux-x64 --self-contained \
            -o "$GITHUB_WORKSPACE/release/migrations/efbundle"

      - name: Build admin SPA
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          mkdir -p release/admin
          cp -r frontend/dist/. release/admin/
        env:
          VITE_API_URL: /api

      - name: Build customer SPA
        run: |
          npm ci --prefix frontend-customer
          npm run build --prefix frontend-customer
          mkdir -p release/customer
          cp -r frontend-customer/dist/. release/customer/
        env:
          VITE_API_URL: /api

      - name: Assemble release
        run: |
          mkdir -p release/deploy
          cp deploy/staging/ecosystem.config.cjs release/deploy/
          cp deploy/staging/deploy.sh release/deploy/
          chmod +x release/api/dotnet-backend release/migrations/efbundle release/deploy/deploy.sh
          tar -czf "release-${GITHUB_SHA}.tar.gz" -C release .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      # Health-gate: deploy.sh does its own health checks + rollback and
      # exits non-zero on failure, which fails this step via `set -euo pipefail`.
      # backend.env is streamed via stdin and never echoed; files are mode 600.
      - name: Deploy to staging VPS
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_BACKEND_ENV: ${{ secrets.STAGING_BACKEND_ENV }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          RELEASE="$GITHUB_SHA"
          TARGET="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          scp "release-${RELEASE}.tar.gz" "$TARGET:/tmp/release-${RELEASE}.tar.gz"
          printf '%s' "$STAGING_BACKEND_ENV" | ssh "$TARGET" '
            set -euo pipefail
            umask 077
            R=/opt/onlinemarket-staging
            V='"$RELEASE"'
            mkdir -p "$R/releases/$V" "$R/shared"
            tar -xzf "/tmp/release-$V.tar.gz" -C "$R/releases/$V"
            chmod 755 "$R/releases/$V" "$R/releases/$V/admin" "$R/releases/$V/customer"
            chmod 644 "$R/releases/$V/admin/index.html" "$R/releases/$V/customer/index.html"
            chmod 755 "$R/releases/$V/admin/assets" "$R/releases/$V/customer/assets"
            chmod 644 "$R/releases/$V/admin/assets/*" "$R/releases/$V/customer/assets/*"
            rm -f "/tmp/release-$V.tar.gz"
            cat > "$R/shared/backend.env.new"
            chmod 600 "$R/shared/backend.env.new"
            if [ -f "$R/shared/backend.env" ] && cmp -s "$R/shared/backend.env" "$R/shared/backend.env.new"; then
              rm -f "$R/shared/backend.env.new"
            else
              mv -f "$R/shared/backend.env.new" "$R/shared/backend.env"
            fi
            chmod 600 "$R/shared/backend.env"
            bash "$R/releases/$V/deploy/deploy.sh" "$V"'
